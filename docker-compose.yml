services:
  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: admin
      POSTGRES_DB: salary_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data

  bot:
    build:
      context: .
      dockerfile: SalaryTelegramBot.Api/Dockerfile
    restart: always
    depends_on:
      - postgres
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DB_PASSWORD: ${DB_PASSWORD}
      BASE_URL: ${BASE_URL}

volumes:
  postgres_data:
